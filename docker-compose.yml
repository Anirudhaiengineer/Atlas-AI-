
services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: atlasai-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: atlasai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5434:5432"

    volumes:
      - atlasai_pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlasai"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    container_name: atlasai-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    ports:
      - "9092:9092"

    volumes:
      - atlasai_kafka_data:/var/lib/kafka/data

  api:
    image: atlasai-api:v1
    container_name: atlasai-api
    restart: unless-stopped
    

    ports:
      - "8000:8000"
    volumes:
      - ./storage/documents:/app/storage/documents

    env_file:
      - .env

    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@postgres:5432/atlasai"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  atlasai_pgdata:
  atlasai_kafka_data:
